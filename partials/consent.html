<div id="cookie-consent-banner"
     class="cookie-consent-banner"
     style="background:#f9f9f9;
            padding:20px;
            border-bottom:1px solid #ccc;
            text-align:center;">

  <h3>Cookie beállítások</h3>

  <p>
    Ez az oldal sütiket használ a legjobb élmény érdekében.
    Kérlek, válaszd ki, hogy mely sütiket engedélyezed.
  </p>

  <div style="margin:10px 0;">
    <button id="btn-accept-all">
      Összes elfogadása
    </button>

    <button id="btn-accept-some">
      Kiválasztottak elfogadása
    </button>

    <button id="btn-reject-all">
      Összes elutasítása
    </button>
  </div>

  <div style="margin-top:10px;">

    <label>
      <input
        id="consent-necessary"
        type="checkbox"
        checked

      Szükséges
    </label>
    <br>

    <label>
      <input
        id="consent-analytics"
        type="checkbox">
      Analitika
    </label>
    <br>

    <label>
      <input
        id="consent-preferences"
        type="checkbox">
      Preferenciák
    </label>
    <br>

    <label>
      <input
        id="consent-marketing"
        type="checkbox">
      Marketing
    </label>

  </div>
</div>
